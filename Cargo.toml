[package]
# Tauri derives the plugin's permission names from `links`, which must match the package
# name: "tauri-plugin-ra" becomes the "ra" plugin, so a capability lists "ra:default".
name = "tauri-plugin-ra"
version = "1.0.0"
description = "RadiantAbyss desktop stack for Tauri: IPC router, invoked payload, storage, tray, context menu, globals."
authors = ["RadiantAbyss"]
license = "ISC"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-ra"

[lib]
# Apps write ra::Route, ra::storage::get(...)
name = "ra"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
# devtools: the built-in "Inspect" context menu entry opens them in dev builds
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-store = "2"
serde = "1"
serde_json = "1"
